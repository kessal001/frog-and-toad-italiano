<style>
  /* Zen Maru Gothic, the rounded face of Japanese picture books: hiragana in
     Noto Serif JP reads thin at story size. Its Latin is used too, so the
     credits match. */
  :root { --text: 'Zen Maru Gothic', 'Noto Serif', Georgia, serif; }
  /* It has no italic; slanted kana looks wrong, so set it upright. */
  .status .title { font-style: normal; }
  /* Kana would otherwise break anywhere; the cover title breaks only at its spaces. */
  /* The title is short and set whole, on one line, so it is sized to fill the
     gable wall between the roof beams, and sits a little lower than the Latin
     editions' title, in the clear. */
  .cover-front .title { word-break: keep-all; top: 20.5cqw; left: 5%; right: 5%; font-size: 9cqw; white-space: nowrap; }
  /* The story text a step heavier than the Latin editions'. The translation
     spaces its words (分かち書き), so lines break at those spaces, not in
     the middle of a word. */
  .page-content p { font-weight: 500; word-break: keep-all; overflow-wrap: break-word; }
</style>

<link rel="stylesheet" href="/fonts/noto-serif.css">
