name: Pubblica il reindirizzamento al sito ufficiale

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v6
      - name: Configura Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepara il reindirizzamento al sito ufficiale
        run: npm run build:github-pages
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara la pubblicazione
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
